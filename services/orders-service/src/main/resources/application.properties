server.port=${ORDERS_SERVICE_PORT:8001}
server.servlet.context-path=/v1

spring.datasource.url=${ORDERS_DB_URL:jdbc:postgresql://127.0.0.1:5432/kmarket}
spring.datasource.username=${ORDERS_DB_USER:orders_svc}
spring.datasource.password=${ORDERS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
orders.outbox.relay.enabled=${ORDERS_OUTBOX_RELAY_ENABLED:true}

app.jwt.secret=${JWT_SECRET}