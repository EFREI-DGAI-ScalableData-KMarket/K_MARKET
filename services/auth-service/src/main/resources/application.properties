spring.application.name=auth-service

# ---------------------------------------------------------------------------
# PostgreSQL datasource (K-Market docker-compose "postgres" service)
# DB: kmarket | schema: auth | role: auth_svc (password = AUTH_DB_PASSWORD in .env)
# Container is published on 127.0.0.1:5432.
# All values can be overridden with environment variables.
# ---------------------------------------------------------------------------
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://127.0.0.1:5432/kmarket}
spring.datasource.username=${AUTH_DB_USER:auth_svc}
spring.datasource.password=${AUTH_DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# The schema is created by db/postgres/05_auth.sql at container init and the
# auth_svc role has no DDL privileges, so Hibernate must NOT alter the schema.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Server — the contract serves everything under /v1 on port 8005
# ---------------------------------------------------------------------------
server.port=${AUTH_SERVICE_PORT:8005}
server.servlet.context-path=/v1

# ---------------------------------------------------------------------------
# JWT (shared secret from .env)
# access token: 15 min (900s) ; refresh token: 30 days
# ---------------------------------------------------------------------------
auth.jwt.secret=${JWT_SECRET:kmarket-local-development-jwt-secret-32chars}
auth.jwt.access-token-ttl-seconds=900
auth.jwt.refresh-token-ttl-seconds=2592000
auth.jwt.issuer=kmarket-auth

# ---------------------------------------------------------------------------
# Swagger UI / OpenAPI (springdoc)
# With context-path /v1 the UI is at:  http://localhost:8005/v1/swagger-ui.html
# and the spec at:                     http://localhost:8005/v1/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs


