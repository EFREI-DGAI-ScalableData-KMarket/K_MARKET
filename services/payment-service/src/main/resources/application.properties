spring.application.name=payment-service

# ---------------------------------------------------------------------------
# PostgreSQL datasource (K-Market docker-compose "postgres" service)
# DB: kmarket | schema: payments | role: payments_svc (password = PAYMENTS_DB_PASSWORD in .env)
# Container is published on 127.0.0.1:5432.
# All values can be overridden with environment variables.
# ---------------------------------------------------------------------------
spring.datasource.url=${PAYMENTS_DB_URL:jdbc:postgresql://127.0.0.1:5432/kmarket}
spring.datasource.username=${PAYMENTS_DB_USER:payments_svc}
spring.datasource.password=${PAYMENTS_DB_PASSWORD:payments}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# The schema is created by data/postgres/04_payments.sql at container init and the
# payments_svc role has no DDL privileges, so Hibernate must NOT alter the schema.
# The dialect is pinned so that a connection failure surfaces as a clear JDBC
# error instead of Hibernate's misleading "Unable to determine Dialect" message.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=payments
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Server — the contract serves everything under /v1 on port 8003
# ---------------------------------------------------------------------------
server.port=${PAYMENTS_SERVICE_PORT:8003}
server.servlet.context-path=/v1

# ---------------------------------------------------------------------------
# JWT (shared HS256 secret from .env) — validated as a resource server.
# auth-service mints the tokens; the whole platform shares JWT_SECRET.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:kmarket-local-development-jwt-secret-32chars}

# ---------------------------------------------------------------------------
# Swagger UI / OpenAPI (springdoc)
# With context-path /v1 the UI is at:  http://localhost:8003/v1/swagger-ui.html
# and the spec at:                     http://localhost:8003/v1/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Business rule (contract): payments strictly above 200 EUR are declined.
# Expressed in cents so the amount check stays integer-only and deterministic.
# ---------------------------------------------------------------------------
payments.limit-cents=${PAYMENTS_LIMIT_CENTS:20000}

