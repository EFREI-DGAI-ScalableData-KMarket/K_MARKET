# Intégration continue : à chaque push et pull request, on démarre la pile avec docker compose,
# on attend le seed, puis on lance les tests d'intégration des services (via la gateway).
name: CI

on:
  push:
  pull_request:

concurrency:                       # un nouveau push annule le run précédent de la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le .env
        run: |
          gen() { openssl rand -hex 24; }
          {
            for v in POSTGRES_PASSWORD ORDERS_DB_PASSWORD INVENTORY_DB_PASSWORD PAYMENTS_DB_PASSWORD \
                     AUTH_DB_PASSWORD MONGO_ROOT_PASSWORD CATALOG_DB_PASSWORD DEMO_PASSWORD \
                     ORDERS_API_KEY CATALOG_API_KEY STREAM_CONSUMER_API_KEY JWT_SECRET \
                     MINIO_ROOT_PASSWORD GRAFANA_ADMIN_PASSWORD; do
              echo "$v=$(gen)"
            done
            echo "MINIO_ROOT_USER=ci"
            echo "SEED_ORDERS=2000"          
          } > .env

      - name: Construire et démarrer la pile (bases, seed, services, gateway)
        run: docker compose up -d --build postgres mongo seed stock-service catalog-service gateway

      - name: Attendre la fin du seed
        run: |
          code=$(docker compose wait seed)
          echo "seed terminé avec le code $code"
          test "$code" -eq 0

      - name: Attendre que les services répondent
        run: |
          for url in http://localhost:8002/v1/health http://localhost:8004/v1/health; do
            for _ in $(seq 60); do curl -fsS "$url" >/dev/null && break; sleep 2; done
            curl -fsS "$url"; echo
          done
          # la gateway route bien vers les services (401 attendu sans jeton)
          for _ in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/warehouses)" = "401" ] && break; sleep 2
          done

      - name: Installer les dépendances des tests
        run: pip install -r services/stock-service/tests/requirements.txt -r services/catalog-service/tests/requirements.txt

      - name: Tests du service Stock
        run: make test-stock

      - name: Tests du service Catalog
        run: make test-catalog

      - name: Logs des conteneurs (en cas d'échec)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Arrêter la pile
        if: always()
        run: docker compose down -v