"""
KMarket — Service Catalogue (GraphQL)

Point d'entrée : POST /v1/catalog (via la gateway : http://localhost:8000/v1/catalog).
Noms de champs en snake_case, comme les contrats REST.

Authentification : en-tête `Authorization: Bearer <JWT>` (émis par auth-api, claim `roles`).
Le contrôle est fait sur chaque query et chaque mutation.
- Lecture (Query) : publique (décision D8). Sans jeton, ou avec le rôle customer : produits actifs
  seulement (le filtre `status` est ignoré, un produit archivé vaut null et n'apparaît pas dans
  productsByIds). L'équipe (admin, catalog_manager, analyst, logistics) et service_account voient
  tout le catalogue. Un jeton fourni doit être valide : sinon UNAUTHORIZED.
- Écriture (Mutation) : catalog_manager, admin. Sans jeton : UNAUTHORIZED ; autre rôle : FORBIDDEN.
À la gateway, le contrôle du jeton sur /v1/catalog est « optionnel » : sans jeton la requête passe,
avec un jeton invalide elle est refusée (401).

Images : GET /v1/catalog/images/{product_id}.svg (hors GraphQL, sans jeton : une balise <img>
n'en envoie pas). Visuel généré à partir du produit (catégorie, nom, prix) ; aucun fichier stocké.

Limitation d'appels (gateway) : au-delà de 50 requêtes/s en moyenne par adresse IP (pointes à 100),
la gateway répond HTTP 429 Too Many Requests, avant même GraphQL.

Erreurs : erreurs GraphQL standard ; `errors[].extensions.code` vaut une des valeurs de ErrorCode
(la réponse HTTP reste 200, comme le veut GraphQL). Les détails éventuels sont dans
`errors[].extensions.details` (ex. errInfo du validator MongoDB pour VALIDATION_ERROR).

Schéma flexible : les attributs varient selon la catégorie (D1). En lecture, union typée
ProductAttributes ; en écriture, JSON validé par le validator $jsonSchema (oneOf) de MongoDB.
Les valeurs d'enum sont celles stockées en base (codes sans accent ni tiret : Beaute, Blu_ray) ;
le front affiche les libellés (« Beauté », « Blu-ray »).
"""

scalar DateTime
scalar JSON

enum ErrorCode {
  "Jeton absent (mutation), invalide ou expiré"
  UNAUTHORIZED
  "Rôle insuffisant pour cette opération (ex. customer ou analyst sur une mutation)"
  FORBIDDEN
  NOT_FOUND
  VALIDATION_ERROR
  CONFLICT
  "Service Stock ou auth-api injoignable / en erreur (createProduct avec initial_stock)"
  UPSTREAM_ERROR
}

#  enums

enum Category {
  Album
  Lightstick
  Merch
  Drama
  Livre
  Beaute
}

"inactive = produit archivé (un produit déjà commandé ne se supprime pas)"
enum ProductStatus {
  active
  inactive
}

enum AlbumType {
  studio
  mini
  single
  mixtape
  anthology
}

enum DramaSupport {
  DVD
  Blu_ray
  Coffret
  Artbook
}

enum Langue {
  fr
  en
  ko
}

#  attributs par catégorie
# Champs non nuls = champs obligatoires du validator MongoDB pour la catégorie.

type AlbumAttributes {
  artist: String!
  version: String!
  type: AlbumType!
  "Date de sortie au format AAAA-MM-JJ (contrôlé par le validator MongoDB)"
  release_date: String!
  photocards: Int
  limited_edition: Boolean
}

type LightstickAttributes {
  artist: String!
  version: String!
  bluetooth: Boolean
  piles: String
}

type MerchAttributes {
  artist: String!
  type: String!
  size: [String!]
  couleur: [String!]
  matiere: String
  "Format d'affiche (ex. A2)"
  format: String
  "Nombre de pièces d'un lot (>= 1)"
  pieces: Int
}

type DramaAttributes {
  serie: String!
  support: DramaSupport!
  saison: Int
  episodes: Int
  sous_titres: [String!]
}

type LivreAttributes {
  isbn: String!
  langue: Langue!
  auteur: String
  pages: Int
  genre: String
}

type BeauteAttributes {
  marque: String!
  contenance_ml: Int!
  type: String
  type_peau: String
  ingredients: [String!]
}

"""
Le type concret dépend de `Product.category` ; le client le lit via `__typename` ou un fragment :
`attributes { __typename ... on AlbumAttributes { artist version } }`

Attention : `type` existe dans Album (AlbumType!), Merch (String!) et Beaute (String). GraphQL refuse
une requête qui demande ces champs de même nom mais de types différents dans plusieurs fragments ;
il faut alors un alias : `... on AlbumAttributes { album_type: type } ... on MerchAttributes { merch_type: type }`.
"""
union ProductAttributes =
    AlbumAttributes
  | LightstickAttributes
  | MerchAttributes
  | DramaAttributes
  | LivreAttributes
  | BeauteAttributes

#  produit

type Product {
  product_id: Int!
  name: String!
  category: Category!
  price_cents: Int!
  tags: [String!]!
  description: String
  attributes: ProductAttributes!
  status: ProductStatus!
  "Date de dernière écriture (création ou mise à jour)"
  indexed_at: DateTime
  "URL de l'image (visuel SVG généré si aucune image n'est fournie)"
  image_url: String!
}

type ProductPage {
  items: [Product!]!
  total: Int!
  has_more: Boolean!
}

#  inputs

"""
Tous les critères sont optionnels et se combinent (ET).
Sans `status` : produits actifs et archivés pour l'équipe ; visiteur et customer : actifs seulement, quel que soit `status`.
"""
input ProductFilter {
  category: Category = null
  status: ProductStatus = null
  "Plein texte sur name et description (index MongoDB french)"
  search: String = null
  min_price_cents: Int = null
  max_price_cents: Int = null
}

input InitialStock {
  warehouse_id: Int!
  quantity: Int!
}

input ProductInput {
  name: String!
  category: Category!
  price_cents: Int!
  "Attributs propres à la catégorie, validés par le validator MongoDB"
  attributes: JSON!
  tags: [String!] = null
  description: String = null
}

"Mise à jour partielle : seuls les champs fournis sont modifiés"
input ProductUpdateInput {
  name: String
  category: Category
  price_cents: Int
  attributes: JSON
  tags: [String!]
  description: String
}

#  opérations

type Query {
  "Lister les produits (filtres + pagination ; tri par product_id, ou par pertinence avec `search`). limit : 1 à 200. Public : actifs seulement sans jeton ou pour un customer"
  products(filter: ProductFilter = null, limit: Int! = 50, offset: Int! = 0): ProductPage!

  "Lire un produit ; null s'il n'existe pas (ou s'il est archivé, sans jeton ou pour un customer)"
  product(product_id: Int!): Product

  "Lire plusieurs produits en un appel (orders-api : prix des lignes de commande). Ordre de la demande ; les ids inconnus sont ignorés (et les archivés, sans jeton ou pour un customer) ; 200 ids maximum"
  productsByIds(ids: [Int!]!): [Product!]!
}

"Écritures : jeton obligatoire, rôle admin ou catalog_manager (UNAUTHORIZED / FORBIDDEN sinon)"
type Mutation {
  "Créer un produit (actif). Avec initial_stock : appelle POST /stock du service Stock ; si cet appel échoue, le produit est supprimé (compensation)"
  createProduct(input: ProductInput!, initial_stock: InitialStock = null): Product!

  "Mettre à jour un produit (partiel : seuls les champs fournis changent)"
  updateProduct(product_id: Int!, input: ProductUpdateInput!): Product!

  "Archiver un produit (status inactive) : on ne supprime pas un produit déjà commandé"
  archiveProduct(product_id: Int!): Product!

  "Réactiver un produit archivé"
  reactivateProduct(product_id: Int!): Product!
}