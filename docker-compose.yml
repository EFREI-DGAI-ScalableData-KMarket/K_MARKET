# KMarket — démarrage : `make up` (ou `docker compose up -d --build`)
# Les scripts de data/postgres et data/mongo ne s'exécutent qu'au PREMIER démarrage (volume vide).
# Pour tout réinitialiser : `make reset`.
#
# Ports (alignés sur les contrats) :
#   gateway 8000 · orders 8001 · stock 8002 · payments 8003 · catalog 8004 · auth 8005
#   dashboard Traefik 8082 · kafka-ui 8080 · spark UI 8081 · minio 9000/9001

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir .env}
      # lus par data/postgres/08_roles.sh
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?voir .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?voir .env}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?voir .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?voir .env}
    command: ["postgres", "-c", "wal_level=logical"]   # prêt pour un CDC (Debezium) plus tard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : pendant l'init, le serveur temporaire n'écoute que sur le socket Unix,
      # donc le conteneur ne devient "healthy" qu'une fois les scripts terminés.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kmarket"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?voir .env}
      MONGO_INITDB_DATABASE: kmarket
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?voir .env}   # lu par data/mongo/01_catalog.js
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db          # dossier de données de l'image mongo
      - ./data/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "mongo", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Remplit les bases une seule fois (ne fait rien si elles contiennent déjà des données).
  seed:
    build: ./seed
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/kmarket
      MONGO_URI: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: kmarket
      DEMO_PASSWORD: ${DEMO_PASSWORD:?voir .env}
      ORDERS_API_KEY: ${ORDERS_API_KEY:?voir .env}
      CATALOG_API_KEY: ${CATALOG_API_KEY:?voir .env}
      STREAM_CONSUMER_API_KEY: ${STREAM_CONSUMER_API_KEY:?voir .env}
    command: ["--orders", "${SEED_ORDERS:-20000}"]
    restart: "no"

  # Service Stock (REST)
  stock-service:
    build: ./services/stock-service
    container_name: stock-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory_svc
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?voir .env}
      POSTGRES_DB: kmarket
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?voir .env}
      OTEL_SERVICE_NAME: stock-service
      OTEL_TRACES_EXPORTER: otlp_proto_http
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "metrics,health"
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  # Service Catalogue (GraphQL)
  catalog-service:
    build: ./services/catalog-service
    container_name: catalog-service
    restart: unless-stopped
    environment:
      # Compte dédié créé par data/mongo/01_catalog.js (moindre privilège, pas root).
      MONGO_URI: mongodb://catalog_svc:${CATALOG_DB_PASSWORD:?voir .env}@mongo:27017/kmarket?authSource=kmarket
      MONGO_DB: kmarket
      JWT_SECRET: ${JWT_SECRET:?voir .env}
      # Appel à POST /stock après création d'un produit
      STOCK_URL: http://stock-service:8002/v1
      AUTH_URL: http://auth-service:8005/v1
      CATALOG_API_KEY: ${CATALOG_API_KEY:?voir .env}
      OTEL_SERVICE_NAME: catalog-service
      OTEL_TRACES_EXPORTER: otlp_proto_http
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "metrics,health"
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      mongo:
        condition: service_healthy

  # Service Commandes (REST, Spring Boot)
  orders-service:
    build: ./services/orders-service
    container_name: orders-service
    restart: unless-stopped
    environment:
      # Compte dédié créé par data/postgres/08_roles.sh (moindre privilège, pas root).
      ORDERS_DB_URL: jdbc:postgresql://postgres:5432/kmarket
      ORDERS_DB_USER: orders_svc
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?voir .env}
      JWT_SECRET: ${JWT_SECRET:?voir .env}
      # Broker interne (listener INTERNAL). Le relais outbox tourne dans le
      # service orders-outbox-relay dédié (profil "stream"), pas ici.
      KAFKA_BOOTSTRAP: kafka:19092
      ORDERS_OUTBOX_RELAY_ENABLED: "false"
      # Catalogue (GraphQL) : valide les produits et récupère les prix (POST /orders).
      CATALOG_BASE_URL: http://catalog-service:8004/v1
      # Stock (REST) : réservation du stock (Saga). orders-api s'authentifie en
      # service_account via auth-api (POST /auth/token avec ORDERS_API_KEY).
      STOCK_BASE_URL: http://stock-service:8002/v1
      AUTH_BASE_URL: http://auth-service:8005/v1
      ORDERS_API_KEY: ${ORDERS_API_KEY:?voir .env}
      # Paiement (REST) : encaissement de la Saga (POST /payments), puis commit du
      # stock et passage à "paid" (ou release + "payment_failed" si refus).
      PAYMENT_BASE_URL: http://payment-service:8003/v1
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
      stock-service:
        condition: service_started
      auth-service:
        condition: service_started
      payment-service:
        condition: service_started

  # Service Auth (REST, Spring Boot)
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      # Compte dédié créé par db/postgres/05_auth.sql (moindre privilège, pas root).
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/kmarket
      AUTH_DB_USER: auth_svc
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?voir .env}
      JWT_SECRET: ${JWT_SECRET:?voir .env}
    ports:
      - "127.0.0.1:8005:8005"
    depends_on:
      postgres:
        condition: service_healthy

  # Service Paiement (REST, Spring Boot)
  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      # Compte dédié créé par data/postgres/08_roles.sh (moindre privilège, pas root).
      PAYMENTS_DB_URL: jdbc:postgresql://postgres:5432/kmarket
      PAYMENTS_DB_USER: payments_svc
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?voir .env}
      JWT_SECRET: ${JWT_SECRET:?voir .env}
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  # API Gateway (Traefik) : configuration dans gateway/
  gateway:
    image: traefik:v3.7
    container_name: gateway
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/traefik.yaml"]
    ports:
      - "127.0.0.1:8000:8000"   # point d'entrée de l'API
      - "127.0.0.1:8082:8080"   # dashboard Traefik
    volumes:
      - ./gateway/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - stock-service
      - catalog-service
      - orders-service
      - auth-service
      - ui

  # Kafka (KRaft, sans ZooKeeper)
  # Deux listeners : INTERNAL (kafka:19092) pour les conteneurs, EXTERNAL (localhost:9092) pour l'hôte.
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    profiles: ["stream"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # sinon l'image écrit dans /tmp et le volume reste vide
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Console web Kafka (topics, partitions, lag des consommateurs).
  # Fork maintenu de provectuslabs/kafka-ui (abandonné).
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["stream"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # Expose à Prometheus les métriques de Kafka : brokers, offsets des topics, retard des consommateurs.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    profiles: ["stream"]
    restart: unless-stopped
    command: ["--kafka.server=kafka:19092"]   # listener INTERNAL
    depends_on:
      kafka:
        condition: service_healthy

  # Crée les topics Kafka une fois (partitions explicites), puis se termine.
  kafka-init:
    image: apache/kafka:3.9.0
    profiles: ["stream"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in inventory.stock-changed inventory.shipment-status-changed orders.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions 4 --replication-factor 1
        done
    restart: "no"

  # Publie dans Kafka les événements de inventory.outbox (même image que stock-service).
  stock-outbox-relay:
    build: ./services/stock-service
    profiles: ["stream"]
    restart: unless-stopped
    command: ["python", "-m", "app.outbox_relay"]
    environment:
      POSTGRES_USER: inventory_svc
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?voir .env}
      POSTGRES_DB: kmarket
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?voir .env}
      KAFKA_BOOTSTRAP: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  
  # Publie dans Kafka les événements de orders.outbox (même image que orders-service).
  # C'est la même application Spring Boot que orders-service, mais avec le relais activé ;
  # le serveur web tourne sur un port éphémère (SERVER_PORT=0) car on ne l'expose pas.
  orders-outbox-relay:
    build: ./services/orders-service
    profiles: ["stream"]
    restart: unless-stopped
    environment:
      ORDERS_DB_URL: jdbc:postgresql://postgres:5432/kmarket
      ORDERS_DB_USER: orders_svc
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?voir .env}
      JWT_SECRET: ${JWT_SECRET:?voir .env}
      KAFKA_BOOTSTRAP: kafka:19092
      ORDERS_OUTBOX_RELAY_ENABLED: "true"
      SERVER_PORT: "0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # --- Observabilité : Prometheus (métriques + alertes) et Grafana (tableau de bord) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle            # rechargement à chaud : curl -X POST localhost:9090/-/reload
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?voir .env}
      # GF_AUTH_ANONYMOUS_ENABLED: "true"           # consultation sans compte (démo) ; modification : admin
      # GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kmarket-overview.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus


  # Traces OpenTelemetry : reçoit l'OTLP (4318) et affiche les traces (interface sur 16686)
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      JAEGER_LISTEN_HOST: 0.0.0.0   # sinon Jaeger n'écoute que sur localhost, inaccessible aux autres conteneurs
    ports:
      - "127.0.0.1:16686:16686"

  # MinIO : stockage objet S3 du Data Lake (zones raw / staging / curated / consumption)
  # Image Chainguard : MinIO ne publie plus d'image Docker communautaire depuis octobre 2025.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    profiles: ["lake"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?voir .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?voir .env}
      # alias "hc" pour le healthcheck, sans passer par un shell (image distroless)
      MC_HOST_hc: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "hc"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Crée le bucket du lake une seule fois, puis se termine (sans shell).
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: ["lake"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint: ["/usr/bin/mc"]
    command: ["mb", "--ignore-existing", "local/${LAKE_BUCKET:-kmarket-lake}"]
    restart: "no"

  # Client S3 (mc) prêt à l'emploi : alias "local" déjà pointé sur le MinIO interne.
  # Ne démarre pas avec `make up` (profil "tools"). Utilisation :
  #   docker compose run --rm mc ls local/kmarket-lake
  #   docker compose run --rm mc cp /data-in/fichier.csv local/kmarket-lake/raw/
  # Le dossier courant de l'hôte est monté en lecture seule dans /data-in pour l'upload.
  mc:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    volumes:
      - ./:/data-in:ro
    entrypoint: ["/usr/bin/mc"]
    command: ["ls", "local/${LAKE_BUCKET:-kmarket-lake}"]

  # Spark : jobs de streaming (Kafka) et transformations du Data Lake
  # Image officielle Apache Spark (bitnami/spark a été retiré de Docker Hub mi-2025).
  spark-master:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-master
    profiles: ["spark"]
    restart: unless-stopped
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "127.0.0.1:7077:7077"   # URL du master (spark://spark-master:7077)
      - "127.0.0.1:8081:8080"   # interface web du master
    volumes:
      - ./spark:/opt/spark-apps:ro

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: spark-worker
    profiles: ["spark"]
    restart: unless-stopped
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    depends_on:
      - spark-master
    volumes:
      - ./spark:/opt/spark-apps:ro

  
  ui:
    build: ./ui
    container_name: ui
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  kafkadata:
  miniodata:
  promdata: